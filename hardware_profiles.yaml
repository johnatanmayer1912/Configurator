# NX-OS Configuration Authority — Hardware Profiles

# Each profile defines port groups, vPC peer-link ports, and vPC keepalive ports.



profiles:



  - name: "Nexus 93180YC-EX  [48x10/25G + 6x40/100G]"

    display_name: "Nexus 93180YC-EX"

    device_class: leaf_10g

    primary_speed_label: "10G"

    speed_badges: ["10G", "40G"]

    total_ports: 54

    port_groups:

      - speed: "10/25G"

        start: 1

        end: 48

        type: "SFP+"

      - speed: "40/100G"

        start: 49

        end: 54

        type: "QSFP28"

    vpc_peer_link:

      - "Ethernet1/53"

      - "Ethernet1/54"

    vpc_keepalive:

      - "Ethernet1/47"

      - "Ethernet1/48"



